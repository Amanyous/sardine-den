<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fc3"/>
      <stop offset="0.45" stop-color="#a76dff"/>
      <stop offset="1" stop-color="#3e78ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe3ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#26003f"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#2a0c4d" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <ellipse cx="250" cy="180" rx="420" ry="300" fill="#ffd9ec" opacity="0.42" filter="url(#blur)"/>
  <ellipse cx="930" cy="880" rx="460" ry="330" fill="#183fff" opacity="0.32" filter="url(#blur)"/>

  <g transform="rotate(-9 540 540)" filter="url(#shadow)">
    <rect x="150" y="210" width="780" height="660" rx="180" fill="url(#glass)"/>
    <rect x="150" y="210" width="780" height="660" rx="180" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M200 330 C 380 230, 700 245, 880 370" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="20" stroke-linecap="round"/>
    <path d="M180 620 C 420 520, 740 690, 900 590" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="540" y="176" font-size="34" font-weight="700" letter-spacing="6" fill-opacity="0.9">LOVE ME HARDER</text>
    <text x="540" y="226" font-size="34" font-weight="700" letter-spacing="6" fill-opacity="0.9">x WE DON'T TALK ANYMORE</text>
  </g>

  <text x="540" y="965" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="8" fill="#ffffff" fill-opacity="0.92">MASHPOP EDIT</text>
</svg>
